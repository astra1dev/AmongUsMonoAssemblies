name: Build & Publish HTML Diffs to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install ilspycmd
        run: |
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify ilspycmd
        run: ilspycmd --version

      - name: Install diffoscope
        run: |
          pip install diffoscope

      - name: Verify diffoscope
        run: |
          diffoscope --version
          diffoscope --list-tools

      - name: Run decompiler
        run: |
          ./decompile_all.sh

      - name: Run generator
        run: |
          ./generate_diffs.sh

      - name: Prepare publish directory
        run: |
          PUBLISH_DIR=publish
          mkdir -p "$PUBLISH_DIR"
          # copy generated HTML and MD files from repo root into publish dir
          shopt -s nullglob
          for f in ./*.html ./*.md; do
            name=$(basename "$f")
            # [ "$name" = "README.md" ] && continue
            cp "$f" "$PUBLISH_DIR/$name"
          done

      - name: Update index.html
        run: |
          python update_index.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
